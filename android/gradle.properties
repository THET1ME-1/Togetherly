org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Disable verbose lint for release builds on CI/dev so metaspace errors happen less often and build succeeds
android.lintOptions.checkReleaseBuilds=false
android.lintOptions.abortOnError=false

# Модель распознавания QR берётся из сервисов Google, а не лежит в APK:
# минус 5,5 МБ (libbarhopper_v3.so + файлы модели). Первую загрузку ведёт
# ModuleInstallClient, см. MlkitModuleChannel.kt.
dev.steenbakker.mobile_scanner.useUnbundled=true
