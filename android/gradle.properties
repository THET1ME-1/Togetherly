org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:HeapBaseMinAddress=4G -Dfile.encoding=UTF-8
android.useAndroidX=true
# Disable verbose lint for release builds on CI/dev so metaspace errors happen less often and build succeeds
android.lintOptions.checkReleaseBuilds=false
android.lintOptions.abortOnError=false
