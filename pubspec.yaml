name: love_app
description: "Togetherly — a private space for couples with shared memories, mood tracking, timers, drawings, and widgets."
publish_to: "none"

version: 1.4.8+32

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  share_plus: ^10.1.3
  app_links: ^6.3.3
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  flutter_local_notifications: ^21.0.0
  file_picker: ^8.0.7
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  firebase_storage: ^12.3.8
  path_provider: ^2.1.5
  just_audio: ^0.9.42
  url_launcher: ^6.3.1
  http: ^1.2.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  home_widget: ^0.7.0
  firebase_messaging: ^15.2.4
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  archive: ^4.0.9
  flutter_image_compress: ^2.3.0
  flutter_animate: ^4.5.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  exif: ^3.3.0
  youtube_player_flutter: ^9.1.1
  timezone: ^0.11.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/emoji/
    - assets/images/widget/
    - assets/images/mascots/
    - assets/images/gif/
    - assets/icons/
    - assets/mascots/
