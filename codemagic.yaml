# Codemagic CI — сборка/подпись/публикация iOS в облачном Mac.
# Android по-прежнему собирается в GitHub Actions (.github/workflows/release-apk.yml).
#
# ПЕРЕД ПЕРВЫМ ЗАПУСКОМ (один раз, в панели Codemagic):
#   1. Teams → Integrations → App Store Connect → добавить API-ключ (.p8 + Key ID +
#      Issuer ID). Назвать его ИМЕННО как в `integrations.app_store_connect` ниже.
#   2. Подключить репозиторий github.com/JbSharan2/love_app.
#   3. (Если GoogleService-Info.plist НЕ закоммичен) — добавить его как зашифрованную
#      переменную и распаковывать в скрипте; сейчас предполагается, что он в репо
#      по пути ios/Runner/GoogleService-Info.plist.
#
# Запуск: пуш тега вида `ios-1.14.0` (см. triggering ниже) или вручную (Start build).

definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 90

workflows:
  ios-appstore:
    name: iOS — App Store / TestFlight
    <<: *instance
    integrations:
      # ИМЯ ключа App Store Connect, заведённого в Codemagic (шаг 1 выше).
      app_store_connect: TogetherlyASC
    environment:
      ios_signing:
        # Управляемая подпись Codemagic: САМА генерирует приватный ключ серта,
        # создаёт distribution-сертификат + app_store-профиль основного приложения
        # и кладёт серт+ключ в keychain CLI. (Сырой fetch-signing-files --create
        # без ключа падал «Cannot save without private key» — здесь ключ генерится
        # автоматически.) Профиль виджета доскачиваем скриптом ниже — он берёт ТОТ
        # ЖЕ серт+ключ. Ранее падало ТОЛЬКО из-за отозванного ключа интеграции;
        # ключ XU8YHQFQAX (Admin) валиден → теперь создастся.
        distribution_type: app_store
        bundle_identifier: com.togetherly.love
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.togetherly.love"
        # Числовой Apple ID приложения из App Store Connect (App Information →
        # General → Apple ID). Нужен для авто-публикации в TestFlight.
        APP_STORE_APP_ID: 6781019737
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    scripts:
      - name: Flutter packages
        script: |
          # SPM (экспериментальный) конфликтует на tocropviewcontroller
          # (image_cropper 3.x vs dkimagepickercontroller 2.x) — собираем через
          # CocoaPods (Podfile + шаг Pod install ниже).
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up provisioning profiles (widget) + apply
        # Управляемый ios_signing уже создал серт (с ключом) + профиль основного
        # приложения и положил серт+ключ в keychain CLI. Доскачиваем профиль
        # виджет-расширения (берёт ТОТ ЖЕ серт — ключ уже доступен, 401 не будет),
        # затем применяем профили: use-profiles переводит проект в РУЧНУЮ подпись
        # (иначе архив уходит в «автоматический» режим → No Accounts).
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID.TogetherlyWidget" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # build-name/number берём из pubspec.yaml (как и Android-пайплайн).
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # На первом этапе — только TestFlight (внутреннее тестирование).
        # Когда убедитесь, что сборка работает — можно включить submit_to_app_store.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - sasamatrosov87@gmail.com
        notify:
          success: true
          failure: true
