name: Android → компилируются ли виджеты

# Зачем: правки нативных виджетов (провайдеры на Kotlin и их разметки) иначе
# проверяет только релизный прогон, и опечатка всплывает уже при выпуске.
# Здесь компилируется один Kotlin приложения: APK не собирается, ничего не
# подписывается и не публикуется.
on:
  push:
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/main/res/layout/**'
      - '.github/workflows/android-widget-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-kotlincheck-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-kotlincheck-
            ${{ runner.os }}-flutterbuild-

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Зависимости
        run: |
          flutter pub get
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Компиляция Kotlin
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
