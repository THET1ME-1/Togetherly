name: iOS → видит ли система наши виджеты

# Зачем: виджетов Togetherly нет в галерее ни в одной версии, при том что в
# собранном IPA расширение на месте, идентификатор — префикс приложения,
# версии совпадают, entitlements и права App ID в порядке. Значит смотреть
# надо не файлы, а решение самой iOS: она либо регистрирует расширение, либо
# молча отвергает.
#
# Симулятор для этого годится: `pluginkit` показывает ЗАРЕГИСТРИРОВАННЫЕ
# расширения, а системный лог — причину отказа. Устройства у нас нет, а
# гадать по исходникам мы уже пробовали.
#
# Ничего не публикует и не подписывает.
on:
  workflow_dispatch:
    inputs:
      strip_lock:
        description: 'Вырезать виджеты экрана блокировки (проверка подозреваемого)'
        required: false
        default: 'false'
      ext_release:
        description: 'Пересобрать расширение с -O, как в TestFlight'
        required: false
        default: 'false'

jobs:
  registry:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          # Та же версия, что собирает релизы: на другой ломаются поды.
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Версии инструментов
        run: |
          flutter --version
          xcodebuild -version
          echo "— доступные симуляторы —"
          xcrun simctl list devices available | head -30

      - name: Зависимости
        run: |
          flutter pub get
          # Поды ставит сама сборка: отдельный `pod install` идёт раньше, чем
          # Flutter разложит симлинки плагинов, и не находит их подспеки.
          pod repo update --silent || true

      - name: Вырезать виджеты экрана блокировки
        if: ${{ inputs.strip_lock == 'true' }}
        run: |
          set -euo pipefail
          # Блок `lockWidgets` целиком состоит из `if #available(iOS 16.0, *)`,
          # то есть тип свойства зависит от условной ветки. Подозрение: на нём
          # ломается извлечение дескрипторов, и тогда галерея пуста не у трёх
          # виджетов экрана блокировки, а у всех двадцати двух.
          python3 tool/strip_lock_widgets.py
          grep -n "lockWidgets" ios/TogetherlyWidget/TogetherlyWidgetBundle.swift \
            || echo "в бандле его больше нет"

      - name: Сборка под симулятор
        run: |
          set -euo pipefail
          # Debug: нам нужна регистрация расширения, а не скорость работы.
          flutter build ios --simulator --debug --no-tree-shake-icons \
            --dart-define=STORE=github
          echo "— что внутри собранного .app —"
          ls -la build/ios/iphonesimulator/Runner.app/PlugIns/ || echo "PlugIns НЕТ ВОВСЕ"

      - name: Расширение с -O вместо debug
        if: ${{ inputs.ext_release == 'true' }}
        # Людям уезжает Release: `SWIFT_OPTIMIZATION_LEVEL = -O`, символы
        # вырезаны, бинарь втрое меньше debug-овского. Прошлая проверка гоняла
        # debug и потому объявила фикс рабочим, хотя на телефонах ничего не
        # изменилось. Само приложение в Release для симулятора Flutter собрать
        # не даёт (AOT-снапшота под симулятор нет), но расширение от Flutter не
        # зависит: собираем ТОЛЬКО его и кладём в debug-овский .app.
        run: |
          set -euxo pipefail
          xcodebuild build \
            -project ios/Runner.xcodeproj \
            -target TogetherlyWidgetExtension \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath /tmp/extrel \
            CODE_SIGNING_ALLOWED=NO
          APPEX=$(find /tmp/extrel -name "TogetherlyWidgetExtension.appex" -maxdepth 6 | head -1)
          echo "собрано: $APPEX"
          DEST=build/ios/iphonesimulator/Runner.app/PlugIns
          rm -rf "$DEST/TogetherlyWidgetExtension.appex"
          cp -R "$APPEX" "$DEST/"
          echo "— размер бинаря (debug был бы ~2 МБ, release ~0,7 МБ) —"
          ls -la "$DEST/TogetherlyWidgetExtension.appex/TogetherlyWidgetExtension"

      - name: Поднять симулятор и поставить приложение
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=None
          for runtime, devs in d.items():
              if 'iOS' not in runtime: continue
              for dev in devs:
                  if 'iPhone' in dev['name']:
                      best=(runtime, dev['udid'], dev['name'])
          print(best[1] if best else '')
          ")
          echo "симулятор: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.togetherly.love || true
          # Дать системе просканировать расширения: chronod делает это не сразу.
          sleep 60
          # И подтолкнуть: перезапуск менеджера виджетов заставляет его заново
          # спросить у расширений, что они умеют.
          xcrun simctl spawn "$DEVICE" launchctl kickstart -k system/com.apple.chronod || true
          sleep 90

      - name: Что знает chronod — менеджер виджетов
        run: |
          set +e
          DATA="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data"
          echo "=============================================================="
          echo "БАЗА CHRONO (список известных системе виджетов)"
          echo "=============================================================="
          find "$DATA/Library" -iname "*hrono*" -maxdepth 3 2>/dev/null | head -20
          echo "— настройки chronod целиком —"
          plutil -p "$DATA/Library/Preferences/com.apple.chronod.plist" 2>/dev/null | head -80
          echo
          echo "— база chrono.sql: таблицы —"
          sqlite3 "$DATA/Library/chronod/chrono.sql" ".tables" 2>&1 | head -20
          echo "— что в ней про наши виджеты —"
          for t in $(sqlite3 "$DATA/Library/chronod/chrono.sql" "select name from sqlite_master where type='table'" 2>/dev/null); do
            n=$(sqlite3 "$DATA/Library/chronod/chrono.sql" "select count(*) from \"$t\"" 2>/dev/null)
            echo "  таблица $t: $n строк"
            sqlite3 "$DATA/Library/chronod/chrono.sql" "select * from \"$t\"" 2>/dev/null | grep -i togetherly | head -5
          done
          echo
          echo "— поиск строки togetherly по контейнерам системы —"
          grep -rl "TogetherlyWidget" "$DATA/Library" 2>/dev/null | head -10

      - name: Что система знает о расширении
        run: |
          set +e
          echo "=============================================================="
          echo "ЗАРЕГИСТРИРОВАННЫЕ РАСШИРЕНИЯ (pluginkit)"
          echo "=============================================================="
          xcrun simctl spawn "$DEVICE" pluginkit -m -v -A -D 2>&1 | grep -i "togetherly" || echo "  НИ ОДНОГО расширения Togetherly не зарегистрировано"
          echo
          echo "— подробности нашего плагина —"
          xcrun simctl spawn "$DEVICE" pluginkit -m -v -A -D -i com.togetherly.love.TogetherlyWidget 2>&1 | head -30
          echo
          echo "=============================================================="
          echo "ЖУРНАЛ: что сказала система про наше расширение"
          echo "=============================================================="
          xcrun simctl spawn "$DEVICE" log show --last 8m --style compact \
            --predicate 'process == "chronod" OR process == "pkd" OR process == "installd"' 2>&1 \
            | grep -iE "togetherly|descriptor" | tail -60
          echo
          echo "— всё, что система сказала про наше расширение —"
          xcrun simctl spawn "$DEVICE" log show --last 8m --style compact \
            --predicate 'eventMessage CONTAINS "TogetherlyWidget"' 2>&1 | tail -40
          echo
          echo "=============================================================="
          echo "СОДЕРЖИМОЕ УСТАНОВЛЕННОГО ПРИЛОЖЕНИЯ"
          echo "=============================================================="
          APP=$(xcrun simctl get_app_container "$DEVICE" com.togetherly.love 2>/dev/null)
          echo "путь: $APP"
          ls -la "$APP/PlugIns" 2>&1 || echo "  PlugIns нет"
          for p in "$APP"/PlugIns/*.appex; do
            echo "— $p"
            plutil -p "$p/Info.plist" | grep -E "CFBundleIdentifier|CFBundleVersion|CFBundleShortVersion|NSExtensionPointIdentifier|MinimumOSVersion|UIDeviceFamily" || true
          done

      - name: Приговор
        # Читать полсотни строк журнала каждый раз — способ пропустить главное.
        # Здесь два числа, по которым видно всё: падало ли расширение и дошли
        # ли до системы описания виджетов.
        run: |
          set +e
          DATA="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data"
          CRASHES=$(xcrun simctl spawn "$DEVICE" log show --last 10m --style compact \
            --predicate 'eventMessage CONTAINS "TogetherlyWidget"' 2>/dev/null \
            | grep -ciE "SIGTRAP|SIGABRT|SIGSEGV|exited with context")
          KINDS=0
          for t in $(sqlite3 "$DATA/Library/chronod/chrono.sql" \
              "select name from sqlite_master where type='table'" 2>/dev/null); do
            n=$(sqlite3 "$DATA/Library/chronod/chrono.sql" \
              "select count(*) from \"$t\"" 2>/dev/null)
            [ -z "$n" ] && continue
            m=$(sqlite3 "$DATA/Library/chronod/chrono.sql" "select * from \"$t\"" 2>/dev/null \
              | grep -ci togetherly)
            KINDS=$((KINDS + m))
          done
          PENDING=$(plutil -p "$DATA/Library/Preferences/com.apple.chronod.plist" 2>/dev/null \
            | grep -c togetherly)
          echo "=============================================================="
          echo "ПРИГОВОР"
          echo "=============================================================="
          echo "аварийных завершений расширения: $CRASHES"
          echo "строк про Togetherly в базе chronod: $KINDS"
          echo "ждёт повторного опроса (extensionsPendingDescriptorRefetch): $PENDING"
          echo
          if [ "$CRASHES" -gt 0 ]; then
            echo "РАСШИРЕНИЕ ПАДАЕТ — галерея будет пустой."
          elif [ "$KINDS" -gt 0 ]; then
            echo "Виджеты доехали до системы: chronod их знает."
          else
            echo "Расширение не падает, но описаний виджетов у системы нет."
          fi
