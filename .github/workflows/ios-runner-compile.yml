name: iOS → компилируется ли приложение

# Зачем: Swift самого приложения (AppDelegate.swift с каналами галереи,
# уведомлений, виджетов) проверяет только релизный прогон, а на ноутбуке без
# macOS его не собрать вовсе. Опечатка всплывала бы уже при выпуске. Здесь
# приложение собирается под симулятор: без подписи, без IPA, без публикации.
on:
  push:
    paths:
      - 'ios/Runner/**'
      # Расширение виджетов собирается вместе с приложением: без этой строки
      # правка виджета не проверялась ничем до самого релиза
      - 'ios/TogetherlyWidget/**'
      - 'ios/Podfile'
      # Своя копия плагина браузера: её Swift тоже собирается только здесь
      - 'third_party/flutter_inappwebview_ios/**'
      - '.github/workflows/ios-runner-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Самый свежий Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$NEWEST" ] && NEWEST=/Applications/Xcode.app
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Пакеты
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Pod install
        run: find . -name "Podfile" -execdir pod install \;

      # --no-tree-shake-icons — по той же причине, что в релизе: IconData
      # значков таймера собирается на ходу.
      - name: Сборка под симулятор
        run: flutter build ios --simulator --debug --no-tree-shake-icons --dart-define=STORE=github

      # Релизная сборка под устройство, без подписи: так собирается магазинная.
      # Нужна ради проверки ниже — в релизе код приложения лежит в самом Runner.
      - name: Релизная сборка без подписи
        run: flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define=STORE=github

      # DeclaredAgeRange (возраст из App Store) есть только с iOS 26, а
      # приложение ставится с 15. Сильная связь с фреймворком роняла бы запуск
      # на старых iOS, поэтому он подключён слабо (-weak_framework в
      # OTHER_LDFLAGS цели Runner). Сверяем по самим бинарникам обеих сборок:
      # в отладочной код приложения лежит в Runner.debug.dylib, в релизной — в Runner.
      - name: DeclaredAgeRange подключён слабо
        run: |
          set -euo pipefail
          for APP in build/ios/iphonesimulator/Runner.app build/ios/iphoneos/Runner.app; do
            FOUND=0
            for BIN in "$APP/Runner" "$APP/Runner.debug.dylib"; do
              [ -f "$BIN" ] || continue
              if otool -l "$BIN" | grep -A2 -E "cmd LC_LOAD(_WEAK)?_DYLIB" | grep -B2 "DeclaredAgeRange" > /tmp/dar.txt; then
                echo "$BIN:"; cat /tmp/dar.txt
                if ! grep -q "LC_LOAD_WEAK_DYLIB" /tmp/dar.txt; then
                  echo "::error::$BIN связан с DeclaredAgeRange сильно — на iOS ниже 26 приложение не запустится"
                  exit 1
                fi
                FOUND=1
              fi
            done
            if [ "$FOUND" != 1 ]; then
              echo "::error::в $APP нет DeclaredAgeRange — запрос возраста на iPhone не собран"
              exit 1
            fi
          done
