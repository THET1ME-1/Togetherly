name: Build & Publish → RuStore

# ── Когда запускается ─────────────────────────────────────────────────────────
#  1) Пуш тега вида rustore-1.14.2  →  git tag rustore-1.14.2 && git push origin rustore-1.14.2
#  2) Вручную: вкладка Actions → "Build & Publish → RuStore" → Run workflow
#  Обычные коммиты и v*-теги (Play/GitHub-релиз) сюда НЕ попадают.
on:
  push:
    tags:
      - 'rustore-*'
  workflow_dispatch:
    inputs:
      whatsnew:
        description: 'Текст «Что нового» для RuStore'
        required: false
        default: 'Обновление приложения'

permissions:
  contents: read

env:
  PACKAGE: com.togetherly.love

jobs:
  # ── Гейт: публикуем в RuStore только если задан ключ API ────────────────────
  # Без RUSTORE_KEY_ID шаг публикации пропускается (сборка всё равно делается и
  # кладётся артефактом). RUSTORE_PRIVATE_KEY_PEM уже в секретах.
  check-rustore:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "RUSTORE_KEY_ID не задан — публикация в RuStore пропущена (только сборка)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  build-rustore:
    needs: check-rustore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutterbuild-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutterbuild-

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Read version from pubspec
        id: ver
        run: |
          LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')   # 1.14.2+82
          echo "name=${LINE%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${LINE##*+}" >> "$GITHUB_OUTPUT"

      # RuStore-сборка: флаг STORE=rustore включает RuStore Billing вместо Google
      # Play Billing. Единый (universal) APK — RuStore принимает один файл.
      - name: Build RuStore APK
        run: flutter build apk --release --dart-define=STORE=rustore

      - name: Stage APK
        id: stage
        run: |
          mkdir -p dist
          OUT="dist/togetherly-rustore-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      # Артефакт доступен всегда — можно скачать и залить вручную, даже если
      # авто-публикация выключена (нет RUSTORE_KEY_ID).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: togetherly-rustore-apk
          path: ${{ steps.stage.outputs.apk }}

      # ── Публикация в RuStore (только если задан RUSTORE_KEY_ID) ──────────────
      - name: Set up Python
        if: needs.check-rustore.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install upload deps
        if: needs.check-rustore.outputs.enabled == 'true'
        run: pip install --quiet requests cryptography

      - name: Publish to RuStore
        if: needs.check-rustore.outputs.enabled == 'true'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY_PEM: ${{ secrets.RUSTORE_PRIVATE_KEY_PEM }}
        run: |
          python tool/rustore_upload.py \
            --package "$PACKAGE" \
            --aab "${{ steps.stage.outputs.apk }}" \
            --whatsnew "${{ github.event.inputs.whatsnew || 'Обновление приложения' }}"
