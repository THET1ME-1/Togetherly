name: iOS unsigned IPA → GitHub release

# Собирает НЕсигнованный IPA (для сайдлоада через AltStore/Sideloadly, которые
# пересобирают подпись под Apple ID пользователя) и прикрепляет его к уже
# существующему релизу. НЕ трогает Play / RuStore / TestFlight.
on:
  # Вызывается из релизного воркфлоу сразу после публикации APK — отдельного
  # запуска руками больше не нужно (в GitHub-релизе всегда лежит и IPA).
  workflow_call:
    inputs:
      tag:
        description: 'Тег релиза, к которому прицепить IPA'
        required: true
        type: string
      draft:
        description: 'Релиз остаётся черновиком (иначе прикрепление его опубликует)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Релиз остаётся тестовым'
        required: false
        default: false
        type: boolean
  # Ручной запуск оставлен для случая «релиз уже есть, IPA не доехал».
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, к которому прицепить IPA'
        required: true
        type: string
        default: 'v1.18.1+126'
      draft:
        description: 'Релиз остаётся черновиком'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Релиз остаётся тестовым'
        required: false
        default: false
        type: boolean

jobs:
  ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$NEWEST" ] && NEWEST=/Applications/Xcode.app
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${LINE%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${LINE##*+}" >> "$GITHUB_OUTPUT"

      - name: Flutter packages
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Pod install
        run: find . -name "Podfile" -execdir pod install \;

      - name: Build unsigned iOS
        # --no-tree-shake-icons: значок таймера и знак своего типа связи
        # выбираются по имени из базы, то есть IconData собирается на ходу.
        # Flutter такое дерево иконок урезать не умеет и падает «Avoid
        # non-constant invocations of IconData» — сборка Android на этом уже
        # споткнулась 29 июля.
        run: flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define=STORE=github

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload && mkdir -p Payload
          cp -R Runner.app Payload/
          IPA="$GITHUB_WORKSPACE/togetherly-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-unsigned.ipa"
          zip -qr9 "$IPA" Payload
          ls -lh "$IPA"

      - name: Attach IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          # Состояние релиза передаём явно. Без этого действие ставит draft:
          # false и prerelease: false, то есть ПУБЛИКУЕТ черновик, который
          # только что создала предыдущая работа: 17.08.2026 так уехало
          # предложение обновиться до 1.29.0 всем людям.
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ (inputs.draft || inputs.prerelease) && 'false' || 'true' }}
          files: togetherly-*-unsigned.ipa
