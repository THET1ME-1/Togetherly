name: iOS → снимок парного виджета на симуляторе

# Зачем: проверить, что виджет iPhone на деле рисует то, что положило
# приложение, — без телефона и без Mac. Файлы расширения
# (ios/TogetherlyWidget/*.swift, кроме бандла с @main) собираются вместе со
# стендом tool/widget_snapshot/Harness.swift в маленькое приложение под
# симулятор. Стенд кладёт ключи, как приложение, рисует LoveWidgetView в PNG
# тем же SwiftUI-кодом и печатает строки «ИТОГ».
#
# Flutter тут не нужен, прогон занимает минуты. Ничего не подписывает и не
# публикует. Снимки — в артефакте widget-snapshot.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Коммит (пусто — как в ветке)'
        required: false
        default: ''

jobs:
  snapshot:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Взять указанный коммит
        if: ${{ inputs.ref != '' }}
        run: |
          git checkout --detach "${{ inputs.ref }}"
          git log -1 --format='проверяем: %h %s'

      - name: Самый свежий Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$NEWEST" ] && NEWEST=/Applications/Xcode.app
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Данные для снимка
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tool/widget_snapshot/make_fixtures.py /tmp/fixtures

      - name: Сборка стенда из файлов расширения
        run: |
          set -euo pipefail
          APP=/tmp/Harness.app
          mkdir -p "$APP/fixtures"
          SRC=$(ls ios/TogetherlyWidget/*.swift | grep -v TogetherlyWidgetBundle.swift)
          echo "файлы расширения:"; echo "$SRC"
          xcrun -sdk iphonesimulator swiftc -parse-as-library \
            -target arm64-apple-ios17.0-simulator -O \
            $SRC tool/widget_snapshot/Harness.swift \
            -o "$APP/Harness"
          cp /tmp/fixtures/* "$APP/fixtures/"
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.togetherly.widgetsnapshot</string>
            <key>CFBundleExecutable</key><string>Harness</string>
            <key>CFBundleName</key><string>Harness</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>UILaunchScreen</key><dict/>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneSimulator</string></array>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$APP/Info.plist"
          codesign --force --sign - "$APP"
          ls -la "$APP" "$APP/fixtures"

      - name: Симулятор и снимок
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m: continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  if dv["name"].startswith("iPhone") and (best is None or ver > best[0]):
                      best = (ver, dv["udid"], dv["name"])
          print(best[1]); print(best, file=sys.stderr)
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/Harness.app
          set +e
          # Предел две минуты: стенд сам выходит, но зависший не должен держать раннер.
          perl -e 'alarm 120; exec @ARGV' xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.togetherly.widgetsnapshot 2>&1 | tee /tmp/harness.log
          set -e
          DATA=$(xcrun simctl get_app_container "$UDID" com.togetherly.widgetsnapshot data)
          mkdir -p /tmp/out
          cp "$DATA/Documents/"*.png /tmp/out/ 2>/dev/null || echo "снимков НЕТ"
          cp /tmp/harness.log /tmp/fixtures/* /tmp/out/
          ls -la /tmp/out
          grep -q "ИТОГ: ВСЁ ВЕРНО" /tmp/harness.log

      - name: Снимки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-snapshot
          path: /tmp/out
