<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Комната — Togetherly</title>
<meta name="robots" content="noindex">
<!-- Яндекс Диск отдаёт файл только тем, кто не представился чужим сайтом:
     с нашим Referer он отвечает 403. Заодно площадки перестают узнавать,
     откуда пришёл человек.
     ВАЖНО: мета действует на всю страницу, а ютуб на запрос без реферера
     отвечает ошибкой 153 и не играет ни одного ролика. Поэтому iframe
     площадок получает свою политику в room.js (у iframe атрибут
     referrerpolicy поддерживается и перебивает страничный, у <video> — нет).
     Стережёт tests/room-youtube-referrer.test.js. -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#150D0F">
<link rel="stylesheet" href="../landing.css?v=20260812">
<link rel="stylesheet" href="room.css?v=20260820b">
<script>
/* В комнате смотрят кино, поэтому тёмная тема здесь по умолчанию: светлую
   получает только тот, кто выбрал её сам. */
(function () {
  try {
    document.documentElement.dataset.theme = localStorage.getItem('watch-theme') || 'dark';
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
/* Приложение сообщает состояние звонка вызовом window.watchVoiceState. Оно
   может прийти раньше, чем выполнится room.js, поэтому первое значение просто
   запоминаем — настоящий обработчик применит его при запуске. */
window.watchVoiceState = (s) => { window.__voicePending = s; };
</script>
</head>
<body class="room-body">

<header class="top top--room">
  <a class="brand" href="../">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__name">TOGETHERLY</span>
    <span class="brand__sub">watch</span>
  </a>
  <span class="status-line" id="status" data-i18n="room.connecting">Подключаюсь…</span>
  <div class="room-code">
    <span class="room-code__cap" data-i18n="room.code">Код комнаты</span>
    <b id="code">—</b>
  </div>
  <button class="btn btn--ghost btn--compact" id="copy" data-i18n-aria="room.copy">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h9v11H9zM6 15H4V4h11v2"/></svg>
    <span data-i18n="room.copy">Скопировать ссылку</span>
  </button>
  <button class="btn btn--ghost btn--compact btn--icon" id="share" data-i18n-aria="room.share" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v13M8 7l4-4 4 4"/></svg>
  </button>
  <!-- Голос. Кнопка живёт в шапке комнаты и красится её токенами, а связь
       поднимает приложение: у страницы нет ни микрофона пары, ни сигналинга.
       Поэтому группа скрыта и показывается только в WebView приложения —
       room.js включает её, увидев мост flutter_inappwebview. Раньше эту кнопку
       рисовал Flutter полосой ПОД комнатой: светлая панель под тёмной
       страницей, и вдобавок она отрезала 84 точки высоты уже после загрузки,
       из-за чего нижний ряд уезжал за край на айфонах (20.08.2026).
       Стережёт tests/room-voice-bridge.test.js. -->
  <span class="voice" id="voice" hidden>
    <button class="btn btn--ghost btn--compact btn--icon voice__btn" id="voiceCall" data-i18n-aria="room.voiceCall">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/></svg>
    </button>
    <span class="voice__state" id="voiceState" hidden><i class="voice__dot" aria-hidden="true"></i><b id="voiceTime"></b></span>
    <button class="btn btn--ghost btn--compact btn--icon voice__btn" id="voiceMic" data-i18n-aria="room.voiceMic" aria-pressed="true" hidden>
      <svg class="i-mic-on" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
      <svg class="i-mic-off" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M15 11V6a3 3 0 0 0-5.9-.75l5.8 5.8A3 3 0 0 0 15 11zM4.3 3.3 3 4.6l6 6V11a3 3 0 0 0 4.4 2.65l1.2 1.2A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a7 7 0 0 0 3.2-1.3l3.2 3.2 1.3-1.3z"/></svg>
    </button>
    <button class="btn btn--compact btn--icon voice__btn voice__btn--hang" id="voiceHang" data-i18n-aria="room.voiceHang" hidden>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M12 9c-1.6 0-3.2.25-4.7.7v3.1c0 .4-.23.75-.57.9-1 .5-1.9 1.13-2.7 1.87a1 1 0 0 1-1.4 0l-2-2a1 1 0 0 1 0-1.42C3.94 9.5 7.76 8 12 8s8.06 1.5 11.37 4.15a1 1 0 0 1 0 1.42l-2 2a1 1 0 0 1-1.4 0c-.8-.74-1.7-1.37-2.7-1.87a1 1 0 0 1-.57-.9v-3.1A16 16 0 0 0 12 9z"/></svg>
    </button>
  </span>
  <button class="theme-btn" id="theme" data-i18n-aria="nav.theme" aria-pressed="true">
    <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
  </button>
</header>

<main class="stage-wrap" id="stage">
  <div class="player" id="player">
    <div class="player__empty">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      <span data-i18n="room.empty">Вставьте ссылку на видео</span>
    </div>
  </div>

  <aside class="side">
    <div class="side__head">
      <h2 data-i18n="room.chat">Чат</h2>
      <span class="viewers" id="viewers" data-i18n="room.alone">вы один</span>
    </div>
    <div class="chat" id="chat"></div>
  </aside>

  <div class="manual" id="manual" hidden>
    <span class="manual__note" data-i18n="room.manualNote">Этим плеером управляет каждый сам: жмите вместе по отсчёту.</span>
    <button class="btn btn--ghost btn--compact" id="together" data-i18n="room.together">Начать вместе</button>
    <button class="btn btn--ghost btn--compact" id="pauseBoth" data-i18n="room.pauseBoth">Пауза у обоих</button>
  </div>

  <div class="source">
    <input id="link" class="source__input" autocomplete="off" spellcheck="false"
           data-i18n-ph="room.linkPlaceholder">
    <button class="btn btn--ghost btn--compact btn--icon" id="pick" data-i18n-aria="room.fileBtn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h6l2 2h8v10H4zM9 12l5 3-5 3z"/></svg>
    </button>
    <input id="file" type="file" accept="video/*" hidden>
    <button class="btn btn--ghost btn--compact btn--icon" id="cinema" data-i18n-aria="room.cinema" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="btn btn--filled btn--compact" id="apply" data-i18n="room.play">Включить</button>
  </div>

  <div class="composer">
    <input id="message" class="input input--flat" autocomplete="off" data-i18n-ph="room.message">
    <button class="btn btn--filled btn--icon" id="send" data-i18n-aria="room.send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
    </button>
  </div>
</main>

<script src="../i18n.js?v=20260812"></script>
<script src="../theme.js?v=20260812"></script>
<script src="../vendor/centrifuge.js"></script>
<!-- Скрипт ютуба (iframe_api) НЕ подключаем тегом: обычный <script src> держит
     разбор страницы, а у операторов, где ютуб замедлен, запрос висит до
     таймаута — room.js тогда не выполняется вовсе, и комната открывается
     мёртвой (жалоба с айфона 18.08.2026). Его грузит whenYT() в room.js, и
     только когда включают ролик с ютуба. Стережёт tests/room-youtube-hang.test.js. -->
<script src="room.js?v=20260820b"></script>
</body>
</html>
