<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Совместная лента — Togetherly</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<!-- Своя страница ленты (с 05.10.2026). Канал пары, вход и звонок — общие с
     комнатой совместного просмотра, они в ../pair.js; ролики, очередь, чат и
     реакции — в reels.js. Разметку ленты строит сам reels.js. -->
<link rel="stylesheet" href="reels.css?v=20261006b">
<script>
/* Приложение сообщает состояние звонка вызовом window.watchVoiceState. Оно
   может прийти раньше, чем выполнится pair.js, поэтому первое значение просто
   запоминаем — `TgPair.voice` применит его при запуске. */
window.watchVoiceState = (s) => { window.__voicePending = s; };
</script>
<!-- Статистика та же, что у комнаты: замер «ролик не пошёл» (reels.js). -->
<script defer src="https://analytics.togetherly.day/script.js" data-website-id="00feef0e-ea5b-435a-8455-af0dc5ac18cb"></script>
</head>
<body class="reels">
<!-- Ожидание с первой отрисовки: скриптов страницы около 170 КБ, и на
     мобильной сети без этого экран секунды стоял чёрным и пустым. reels.js
     убирает его, когда встала лента, — её экран ожидания стоит там же. -->
<div class="rl-boot" id="rlBoot" role="status">
  <span class="rl-spin"></span>
  <b id="rlBootTitle">Собираем ленту…</b>
  <span class="rl-wait-sub" id="rlBootSub">Первые ролики приходят за несколько секунд</span>
</div>
<script>
/* Язык — тем же правилом, что i18n.js: `?lang=` от приложения, выбор
   человека, иначе язык браузера. */
(function () {
  var lang = 'ru';
  try {
    // Все девять языков приложения (до 23.11.2026 здесь были только ru, en, pt).
    var known = ['ru', 'en', 'pt', 'uk', 'zh', 'de', 'fr', 'es', 'it'];
    var asked = new URLSearchParams(location.search).get('lang') || '';
    var saved = localStorage.getItem('togetherly.watch.lang');
    if (known.indexOf(asked) >= 0) lang = asked;
    else if (known.indexOf(saved) >= 0) lang = saved;
    else {
      lang = 'en';
      var langs = navigator.languages || [navigator.language || 'en'];
      for (var i = 0; i < langs.length; i++) {
        var two = String(langs[i]).toLowerCase().slice(0, 2);
        if (two !== 'en' && known.indexOf(two) >= 0) { lang = two; break; }
      }
    }
  } catch (e) {}
  var boot = {
    en: ['Gathering your feed…', 'The first clips arrive in a few seconds'],
    pt: ['Montando o feed…', 'Os primeiros vídeos chegam em poucos segundos'],
    uk: ['Збираємо стрічку…', 'Перші ролики приходять за кілька секунд'],
    zh: ['正在准备推荐流…', '几秒内就会出现第一批视频'],
    de: ['Stelle deinen Feed zusammen…', 'Die ersten Clips kommen in ein paar Sekunden'],
    fr: ['On prépare ton fil…', 'Les premières vidéos arrivent en quelques secondes'],
    es: ['Preparando tu feed…', 'Los primeros vídeos llegan en unos segundos'],
    it: ['Preparo il tuo feed…', 'I primi video arrivano in pochi secondi'],
  }[lang];
  if (!boot) return;
  document.getElementById('rlBootTitle').textContent = boot[0];
  document.getElementById('rlBootSub').textContent = boot[1];
})();
</script>
<script src="../i18n.js?v=20261116"></script>
<script src="../vendor/centrifuge.js"></script>
<script src="../pair.js?v=20261005a"></script>
<script src="reels.js?v=20261116"></script>
</body>
</html>
