<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love App - Email Verification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 20px 0; }
    p { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✉️ Email Verification</h1>
    <p>Opening Love App...</p>
    <p style="font-size: 14px; margin-top: 30px;">If the app doesn't open, please check your email.</p>
  </div>
  
  <script>
    // Автоматически попытаться открыть приложение
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.toString()) {
      window.location.href = 'loveapp://emaillink?' + urlParams.toString();
    }
  </script>
</body>
</html>
